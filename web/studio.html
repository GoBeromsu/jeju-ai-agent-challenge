<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상권하르방 · 제주 상권 상담</title><link rel="stylesheet" href="studio-ui.css"><link rel="icon" href="data:,"></head><body><header><b><span class="mark" aria-hidden="true">귤</span> 상권하르방</b><span class="sep">/</span><span>방문 전 상권 조사</span><span class="header-note">가게 자리를 함께 살펴봅니다</span></header><main><section id="consult"><div class="section-title"><span class="index">01</span><h2>창업 상담</h2><button id="newConsultation" type="button">새 상담</button></div><div id="feed" role="log" aria-live="polite"><div class="intro"><small><span class="bubblemark" aria-hidden="true">귤</span> 귤이 · 상담 도우미</small><h1>제주에서 가게 자리를<br>함께 찾아 드립니다</h1><p>업종, 동네, 손님 중 하나부터 들려주시면 됩니다. 예: 작은 카페 · 성산읍 근처 · 관광객이 많은 곳</p></div></div><div id="options"></div><form id="form"><label class="sr" for="question">창업 상담 질문</label><textarea id="question" rows="2" placeholder="제주에 작은 카페를 열고 싶어요"></textarea><button id="submit" aria-label="질문 보내기">전송</button></form></section><section id="bench"><div class="section-title"><span class="index">02</span><h2>후보 지도</h2><button id="all" hidden>제주 전체</button></div><div id="mwrap"><div id="maphead"><small id="area">제주특별자치도</small><h1 id="place">제주 전도</h1><p id="mapLegend">지역 경계 · 답사 순서</p></div><div id="kakaoMap" class="kakao-map" hidden></div><svg id="map" aria-label="제주 읍면동 경계와 답사 후보 지도" viewBox="-42000 -28000 84000 65000"></svg><div id="mapbar"><label for="select">동네 선택</label><select id="select"><option value="">동네 고르기</option></select></div></div><section id="facts"><div class="headingrow"><h2>동네 요약</h2><span id="scope">읍면동 단위</span></div><p id="hint">제주 2D 지도에서 동네와 답사 후보를 함께 확인합니다. 확대·축소는 보기만 바꿉니다.</p><div id="records"></div></section></section></main><script type="module" src="studio-client.js"></script></body></html>
