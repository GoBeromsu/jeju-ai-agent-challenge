<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>제주 동네 답사</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:," />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="labels"></div>

  <div id="left">
    <header id="title" class="panel">
      <h1>제주 동네 답사</h1>
      <p>가게 자리를 보러 가기 전에, 어느 동네부터 걸어 볼지 함께 좁혀요.</p>
      <a id="studioLink" href="studio.html">상담 화면에서 보기 ↗</a>
    </header>

    <section id="picker" class="panel" aria-label="동네 고르기">
      <h2>동네 고르기</h2>
      <p class="hint">이름을 몰라도 괜찮아요. 지도에서 누르거나 아래에서 고르세요.</p>
      <div id="pickerTabs" role="tablist"></div>
      <ul id="dongList"></ul>
    </section>

    <section id="profile" class="panel" aria-label="내 가게 조건" hidden>
      <h2>내 가게 조건</h2>
      <ul id="slots"></ul>
      <button id="changeDong" type="button">다른 동네</button>
    </section>
  </div>

  <aside id="card" class="panel" hidden>
    <div id="cardNav">
      <button id="cardBack" type="button" hidden>← 동네 정보</button>
      <button id="cardClose" type="button" aria-label="정보 닫기">닫기</button>
    </div>
    <div id="cardBody"></div>
  </aside>

  <section id="chat" class="panel">
    <div id="candBar" aria-label="상담 후보" hidden></div>
    <p id="message" aria-live="polite"></p>
    <p id="workLog" hidden></p>
    <div id="chips"></div>
    <form id="ask">
      <input id="text" autocomplete="off" placeholder="예: 여기 왜 표시됐어요? / 근처 약국 어디 있어요?" />
      <button type="submit">보내기</button>
    </form>
  </section>

  <nav id="mapTools" aria-label="지도 조작">
    <button id="zoomIn" type="button" aria-label="확대"><span>+</span>확대</button>
    <button id="zoomOut" type="button" aria-label="축소"><span>−</span>축소</button>
    <button id="back" type="button" disabled>뒤로</button>
    <button id="home" type="button">제주 전체</button>
  </nav>
  <div id="colorKey" hidden></div>

  <section id="mapReference" aria-label="지도 방향 및 축척" hidden>
    <div class="mapPlace">
      <span id="mapZoomBand">섬 전체</span>
      <strong id="mapPlace">제주</strong>
    </div>
    <button id="mapNorth" type="button" title="북쪽 정렬" aria-label="북쪽 정렬">
      <span aria-hidden="true">N</span>
      <svg id="mapNeedle" aria-hidden="true" width="18" height="22" viewBox="0 0 18 22">
        <path d="M9 1 16 19 9 15Z" fill="#a9bab5"/>
        <path d="M9 1 2 19 9 15Z" fill="#28574f"/>
      </svg>
    </button>
    <button id="mapRecenter" type="button" hidden>동네 중심</button>
    <div class="mapMeasure">
      <span id="mapScale" aria-label="수평 축척"></span>
      <span>등고선 간격 <b id="mapContour"></b></span>
    </div>
    <span id="mapLoadNote" role="status">도로·건물 정보를 불러오는 중…</span>
    <span id="mapWalkNote" hidden>가정 보행 · 실제 관측 아님</span>
  </section>
  <a id="mapCredit" href="studio-sources.txt" target="_blank" rel="noopener">Copernicus DEM · © OpenStreetMap · OpenFreeMap</a>

  <div id="loading">
    <span id="loadMessage" role="status">제주 지도를 불러오는 중…</span>
    <button id="mapRetry" type="button" hidden>다시 시도</button>
  </div>
  <div id="metrics" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
